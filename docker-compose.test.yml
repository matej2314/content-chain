services:
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres-e2e
    restart: 'no'
    env_file:
      - ./apps/api/.env.test
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - api-postgres-e2e:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  api-postgres-e2e:
