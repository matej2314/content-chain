services:
  postgres:
    image: postgres:16-alpine
    container_name: cc-postgres
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - api-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cc-network

  ai-provider-gateway:
    build:
      context: .
      dockerfile: apps/ai-provider-gateway/deployment/docker/Dockerfile
      target: production
    container_name: cc-ai-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:3301:3100"
    env_file:
      - ./apps/ai-provider-gateway/.env
    environment:
      NODE_ENV: production
      PORT: 3100
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3100/api/v1/health/ready', (r) => { let body = ''; r.on('data', (c) => body += c); r.on('end', () => { try { const j = JSON.parse(body); process.exit(r.statusCode === 200 && j.status === 'ready' ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks:
      - cc-network
      - main_network
    volumes:
      - ./apps/ai-provider-gateway/logs:/app/logs

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    container_name: cc-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
      - .env.dev
    environment:
      NODE_ENV: production
      PORT: 3001
      GATEWAY_BASE_URL: http://ai-provider-gateway:3100
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DATABASE_URL="postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=public"
        exec /app/docker-entrypoint.sh node dist/main.js
    ports:
      - "127.0.0.1:3300:3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/api/v1/health', (r) => { let body = ''; r.on('data', (c) => body += c); r.on('end', () => { try { const j = JSON.parse(body); process.exit(r.statusCode === 200 && j.status === 'healthy' ? 0 : 1); } catch { process.exit(1); } }); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      ai-provider-gateway:
        condition: service_healthy
    networks:
      - cc-network
      - main_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
    container_name: cc-frontend
    restart: unless-stopped
    env_file:
      - ./apps/frontend/.env
    environment:
      NODE_ENV: production
      PORT: 3004
      API_BASE_URL: http://api:3001
    ports:
      - "0.0.0.0:3303:3004"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cc-network
      - main_network

volumes:
  api-postgres:

networks:
  cc-network:
    name: cc-network
  main_network:
    external: true
    name: main_network
