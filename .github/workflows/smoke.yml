# Manual smoke: docker-compose build/up + api unit + e2e.
# Run from Actions → Smoke → Run workflow → set "branch".
# Compose job uses repository secrets named like root .env keys
# (GATEWAY_KEY, JWT_SECRET, SMTP_*, MASTER_KEY, *API_KEY, GATEWAY_KEY_*).
# Keep GATEWAY_KEY equal to GATEWAY_KEY_WEBAPP so api can call the gateway.
name: Smoke

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch, tag, or SHA to checkout and smoke-test
        required: true
        default: main
        type: string

concurrency:
  group: smoke-${{ inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "9.0.0"
  NODE_VERSION: "24.19.0"
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1

jobs:
  compose-smoke:
    name: Docker Compose build + up
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Create external Docker network (main_network)
        run: docker network create main_network || true

      - name: Prepare api SQLite data directory
        run: |
          sudo mkdir -p /opt/content-chain/data
          sudo chown 1001:1001 /opt/content-chain/data

      # Repo secrets: names match root .env / gateway.config.yaml refs
      # (GATEWAY_KEY, JWT_SECRET, SMTP_*, MASTER_KEY, *API_KEY, GATEWAY_KEY_*).
      - name: Write root .env for compose smoke
        env:
          GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          GATEWAY_KEY_WEBAPP: ${{ secrets.GATEWAY_KEY_WEBAPP }}
          GATEWAY_KEY_IDE_PLUGIN: ${{ secrets.GATEWAY_KEY_IDE_PLUGIN }}
        run: |
          set -euo pipefail
          required=(
            GATEWAY_KEY
            JWT_SECRET
            MAIL_FROM
            SMTP_HOST
            SMTP_PORT
            SMTP_USER
            SMTP_PASS
            MASTER_KEY
            ANTHROPIC_API_KEY
            GOOGLE_API_KEY
            OPENAI_API_KEY
            OPENAI_BASE_URL
            DEEPSEEK_API_KEY
            DEEPSEEK_BASE_URL
            GATEWAY_KEY_WEBAPP
            GATEWAY_KEY_IDE_PLUGIN
          )
          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          umask 077
          {
            echo "NODE_ENV=production"
            echo "PORT=3001"
            echo "APP_PUBLIC_URL=http://127.0.0.1:3303"
            echo "DATABASE_URL=file:/app/data/chain.db"
            echo "GATEWAY_BASE_URL=http://ai-provider-gateway:3100"
            echo "GATEWAY_KEY=${GATEWAY_KEY}"
            echo "GATEWAY_MODEL_ALIAS=chat-default"
            echo "MAX_CONCURRENT_RUNS=3"
            echo "SSE_HEARTBEAT_MS=25000"
            echo "RUN_SSE_SUBJECT_TTL_MS=600000"
            echo "JWT_SECRET=${JWT_SECRET}"
            echo "JWT_ACCESS_TTL=15m"
            echo "JWT_REFRESH_TTL=1d"
            echo "INVITE_TTL=7d"
            echo "ACTIVATION_TTL=7d"
            echo "REVIEW_TTL=2h"
            echo "REVIEW_SWEEP_INTERVAL=5m"
            echo "MAIL_FROM=${MAIL_FROM}"
            echo "SMTP_HOST=${SMTP_HOST}"
            echo "SMTP_PORT=${SMTP_PORT}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASS=${SMTP_PASS}"
            echo "CORS_ORIGIN=http://127.0.0.1:3303"
            echo "DEMO_MODE=false"
            echo "GUEST_GLOBAL_CAP_PER_DAY=30"
            echo "GUEST_RATING_CAP_PER_DAY=10"
            echo "API_BASE_URL=http://api:3001"
            echo "MASTER_KEY=${MASTER_KEY}"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "GOOGLE_API_KEY=${GOOGLE_API_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "OPENAI_BASE_URL=${OPENAI_BASE_URL}"
            echo "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}"
            echo "DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}"
            echo "GATEWAY_KEY_WEBAPP=${GATEWAY_KEY_WEBAPP}"
            echo "GATEWAY_KEY_IDE_PLUGIN=${GATEWAY_KEY_IDE_PLUGIN}"
            echo "CACHE_ENABLED=false"
            echo "CACHE_BACKEND=noop"
            echo "RATE_LIMIT_SMART_ENABLED=false"
            echo "SEMANTIC_CACHE_ENABLED=false"
            echo "LOG_LEVEL=info"
            echo "LOG_ADAPTER=pino"
            echo "LOG_PRETTY=false"
            echo "METRICS_BACKEND=noop"
            echo "ERROR_REPORTING_ADAPTER=noop"
            echo "SENTRY_ENABLED=false"
          } > .env

      - name: Docker Compose build
        run: docker compose -f docker-compose.yml build

      - name: Docker Compose up
        run: docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Wait for service health
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          while (( SECONDS < deadline )); do
            api_ok=0
            gw_ok=0
            if curl -fsS "http://127.0.0.1:3300/api/v1/health" | grep -q '"status":"healthy"'; then
              api_ok=1
            fi
            if curl -fsS "http://127.0.0.1:3301/api/v1/health/ready" | grep -q '"status":"ready"'; then
              gw_ok=1
            fi
            if [[ "$api_ok" -eq 1 && "$gw_ok" -eq 1 ]]; then
              echo "api + gateway healthy"
              curl -fsS -o /dev/null -w "frontend HTTP %{http_code}\n" "http://127.0.0.1:3303/" || true
              exit 0
            fi
            echo "waiting… api=$api_ok gw=$gw_ok"
            docker compose -f docker-compose.yml ps || true
            sleep 10
          done
          echo "::error::Services did not become healthy in time"
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color --tail=200
          exit 1

      - name: Tear down compose stack
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans || true

  unit:
    name: Unit tests (api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:api

  e2e:
    name: E2E tests (api)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout ${{ inputs.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/checkout@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
        run: pnpm test:e2e:api
